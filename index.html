<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connection Error</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d1117;
      font-family: ui-monospace, 'Cascadia Code', 'Segoe UI', monospace;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .box {
      max-width: 560px;
      width: 100%;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 40px;
      background: #161b22;
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      border: 2px solid #f85149;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f85149;
      font-size: 28px;
      font-weight: 700;
    }
    h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f0f6fc;
    }
    p {
      font-size: 13px;
      color: #8b949e;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .code {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 12px 16px;
      font-size: 12px;
      color: #f85149;
      word-break: break-all;
      margin-bottom: 20px;
      font-family: monospace;
    }
    hr {
      border: none;
      border-top: 1px solid #21262d;
      margin: 20px 0;
    }
    .foot {
      font-size: 11px;
      color: #484f58;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">!</div>
    <h1>Secure connection failed</h1>
    <p>The server rejected the handshake. The certificate chain could not be verified. Contact the site administrator.</p>
    <div class="code">0x800B0109 &mdash; CERT_E_CHAIN_FAILURE</div>
    <hr>
    <p class="foot">RLS Store</p>
  </div>
</body>
</html>
